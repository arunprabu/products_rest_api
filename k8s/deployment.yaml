# Kubernetes Deployment for the containerized Products REST API.
#
# The image already runs as the unprivileged `app` user (see Dockerfile `USER app`),
# so the pod securityContext below reinforces that rather than changing it.
#
# NOTE: the probes target `/openapi.json`, which the FastAPI app always exposes.
# If a dedicated `/health` route is added later, point the probes at it instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-rest-api
  labels:
    app.kubernetes.io/name: products-rest-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: products-rest-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: products-rest-api
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replace with the published image, e.g. ghcr.io/<owner>/<repo>:<sha>.
          image: ghcr.io/OWNER/REPO:latest
          # `:latest` is mutable, so always pull to avoid stale cached layers.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_PATH
              value: /app/data/products.db
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # SQLite needs a writable directory; the root filesystem is read-only.
            - name: data
              mountPath: /app/data
            # Writable scratch space for the interpreter and any temp files.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
